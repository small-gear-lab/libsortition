name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # コアのテストと lint。バインディングが読み込む共有ライブラリもここで作る
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Every version number is the same
        run: python3 .github/scripts/version.py check
      - run: cargo test --locked -p sortition
      - run: cargo test --locked -p sortition --no-default-features
      - run: cargo test --locked -p sortition-cli
      - run: cargo clippy --all-targets --locked -p sortition -- -D warnings
      - run: cargo clippy --all-targets --locked -p sortition-cli -- -D warnings
      # docs.rs に出るドキュメントに、壊れたリンクなどの警告がないこと（例は doc test として cargo test が動かす）
      - run: cargo doc --locked --no-deps -p sortition
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --locked -p sortition --no-default-features -- -D warnings
      # wasm には OS の乱数源がないので、.cargo/config.toml の custom backend で解く（ビルドできることの確認）
      - run: cargo clippy --locked --release --target wasm32-unknown-unknown -p sortition -- -D warnings
      - run: cargo build --release --locked -p sortition
      # C ABI を C99 と C++17 の両方から使えること（examples/c は、ほかのバインディングと同じ当選者を出す）
      - run: make -C examples/c check
      # crates.io に出す crate に、ライセンスと NOTICE が実体で入っていること。
      # core/ のそれらはルートへのシンボリックリンクなので、壊れたり別の内容のコピーに置き換わったりしていないか確かめる
      - name: The crate package contains the license files
        run: |
          cargo package -p sortition --locked --no-verify
          for f in LICENSE-MIT LICENSE-APACHE NOTICE; do
            tar -xzOf target/package/sortition-*.crate --wildcards "sortition-*/$f" | cmp - "$f"
          done
      # sortition-cli の crate は、sortition が crates.io に公開されるまでパッケージにできないので、
      # cli/ のリンクが、ルートの同じ内容を指していることだけを確かめる
      - name: The license links in cli/ point to the root files
        run: |
          for f in LICENSE-MIT LICENSE-APACHE NOTICE; do
            cmp "cli/$f" "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: libsortition-linux
          path: target/release/libsortition.so
          if-no-files-found: error

  # Linux 以外でも、core と CLI が動くこと（リリースでは macOS と Windows のバイナリも作る）。
  # 初めて動かすので、通るのを確かめるまでは結果を見るだけにして、失敗してもワークフローは落とさない
  portable:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p sortition -p sortition-cli
      - run: cargo build --release --locked -p sortition -p sortition-cli

  # core/Cargo.toml の rust-version（最小の Rust）でビルドして、テストが通ること。
  # 依存は、その Rust で動く版を選ぶ解決（fallback）で入れ直す（コミットしてある Cargo.lock は最新の版を使う）
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' core/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: rm Cargo.lock
      - run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo generate-lockfile
      - run: cargo test --locked -p sortition
      - run: cargo test --locked -p sortition --no-default-features
      - run: cargo test --locked -p sortition-cli

  # 仕様書（docs/SPEC.md）だけから書いた参照実装が、共通のテストベクトルを再現できること。
  # 仕様書とコードがずれていないことの確認になる
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python test-vectors/reference.py

  python:
    needs: core
    runs-on: ubuntu-latest
    # 対象は、Python 自身がサポートしている版（上流のサポートが終わった版は対象にしない）
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - run: python -m unittest discover -s bindings/python/tests -v

  ruby:
    needs: core
    runs-on: ubuntu-latest
    # 対象は、Ruby 自身がサポートしている版
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - run: ruby -Ibindings/ruby/lib bindings/ruby/test/sortition_test.rb

  node:
    needs: core
    runs-on: ubuntu-latest
    # 対象は、Node.js 自身がサポートしている LTS の 22 と 24（20 は 2026-04-30 に終わった。node-gyp 13 も 22.22 以上を要求する）。
    # Current の 26 は、LTS になる（2026-10-28）まで結果を見るだけにして、失敗してもワークフローは落とさない
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: "22", experimental: false }
          - { node: "24", experimental: false }
          - { node: "26", experimental: true }
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - run: npm ci
      - run: npm run build
      - run: npm test

  # WebAssembly はネイティブの共有ライブラリを使わず、wasm32 向けに自分でビルドする
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bindings/wasm/build.sh
      - run: npm test
        working-directory: bindings/wasm

  # Go embeds the WebAssembly build, so it needs neither the native library nor a Rust toolchain
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: bindings/go/go.sum
      - run: go vet ./...
        working-directory: bindings/go
      - run: go test -race ./...
        working-directory: bindings/go

  # The official Swift image has the newest toolchain; it has no Rust, so the core is built inside it
  swift:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          cargo build --release --locked -p sortition
      - run: |
          lib="$PWD/target/release"
          swift test -Xswiftc -warnings-as-errors -Xlinker -L"$lib" -Xlinker -rpath -Xlinker "$lib"

  dart:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - run: dart pub get
        working-directory: bindings/dart
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: bindings/dart
      - run: dart analyze --fatal-infos
        working-directory: bindings/dart
      - run: dart test
        working-directory: bindings/dart

  java:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - run: ./gradlew test javadoc
        working-directory: bindings/java

  dotnet:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - run: dotnet test bindings/dotnet

  php:
    needs: core
    runs-on: ubuntu-latest
    # 対応するのは、PHP が今サポートしている 8.2 以降。8.5 は初めて通るまで結果を見るだけにして、失敗してもワークフローは落とさない
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.5", experimental: true }
          - { php: "8.4", experimental: false }
          - { php: "8.3", experimental: false }
          - { php: "8.2", experimental: false }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/download-artifact@v8
        with:
          name: libsortition-linux
          path: target/release
      - name: Build the extension
        working-directory: bindings/php
        run: |
          phpize
          ./configure --with-sortition
          make
      - name: Run the phpt tests
        working-directory: bindings/php
        env:
          NO_INTERACTION: "1"
          REPORT_EXIT_STATUS: "1"
        run: make test TESTS=tests
