name: Release

# Pushing a tag vX.Y.Z builds the release assets and makes a DRAFT GitHub Release with them:
#   - the sortition command and the shared library (with the C header) for each platform
#   - the npm package of the WebAssembly build, and sortition.wasm itself
#   - SHA256SUMS, and a build provenance attestation for every file
# A person reads the draft and presses "Publish release"; that starts pages.yml, which publishes
# /vX.Y.Z/ (and /latest/ for a stable version), and publish.yml, which publishes to crates.io, npm and
# NuGet (see "Releasing" in AGENTS.md).
#
# Run by hand ("Run workflow"), it is a dry run: it builds everything from the branch you choose and
# keeps the files as workflow artifacts, but makes no release and no attestation.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 .github/scripts/version.py show)"
          fi
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag must look like v1.2.3 or v1.2.3-rc.1, but it is '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "${BASH_REMATCH[2]}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Every version number matches the tag
        run: python3 .github/scripts/version.py check "${{ steps.v.outputs.tag }}"
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CI passed on the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml --status success --json conclusion --jq length)"
          if [ "$n" -lt 1 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA. Wait for it, then push the tag again."
            exit 1
          fi

  native:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, lib: libsortition.so, exe: "" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, lib: libsortition.so, exe: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, lib: libsortition.dylib, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, lib: libsortition.dylib, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, lib: sortition.dll, exe: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p sortition -p sortition-cli
      - name: Stage
        id: stage
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
          LIB: ${{ matrix.lib }}
          EXE: ${{ matrix.exe }}
        run: |
          name="sortition-v$VERSION-$TARGET"
          out="target/$TARGET/release"
          mkdir -p "stage/$name/bin" "stage/$name/lib" "stage/$name/include"
          cp "$out/sortition$EXE" "stage/$name/bin/"
          cp "$out/$LIB" "stage/$name/lib/"
          if [ -f "$out/sortition.dll.lib" ]; then cp "$out/sortition.dll.lib" "stage/$name/lib/"; fi
          cp core/include/sortition.h "stage/$name/include/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "stage/$name/"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          NAME: ${{ steps.stage.outputs.name }}
          EXE: ${{ matrix.exe }}
        run: |
          got="$(printf 'alice\nbob\ncarol\ndave\n' | "stage/$NAME/bin/sortition$EXE" draw --seed 'my seed' -k 2 | tr -d '\r' | tr '\n' ' ')"
          [ "$got" = "dave bob " ] || { echo "unexpected output: $got"; exit 1; }
      - name: Archive
        env:
          NAME: ${{ steps.stage.outputs.name }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir dist
          if [ -n "$EXE" ]; then
            (cd stage && 7z a -tzip "../dist/$NAME.zip" "$NAME" >/dev/null)
          else
            tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bindings/wasm/build.sh
      - run: npm test
        working-directory: bindings/wasm
      - name: Pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          (cd bindings/wasm && npm pack --pack-destination ../../dist)
          cp bindings/wasm/sortition.wasm "dist/sortition-v$VERSION.wasm"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wasm
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@v4
        if: github.event_name == 'push'
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Keep the files (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: dist/*
      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          cat > notes.md <<'NOTES'
          ## Verifying the files

          ```sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify <file> --repo small-gear-lab/libsortition
          ```

          Each `sortition-*` archive has `bin/sortition` (the command), `lib/` (the shared library) and
          `include/sortition.h`. `libsortition-wasm-*.tgz` is the npm package of the WebAssembly build.
          NOTES
          flags=(--draft --verify-tag --generate-notes --notes-file notes.md --title "$TAG")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}"
