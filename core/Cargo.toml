[package]
name = "sortition"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Minimal unbiased random lottery (sampling without replacement) core with a C ABI"
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/small-gear-lab/libsortition"
homepage = "https://small-gear-lab.github.io/libsortition/"
keywords = ["lottery", "random", "sampling", "sortition", "ffi"]
categories = ["algorithms"]
authors = ["marie-222 <289302950+marie-222@users.noreply.github.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["yaml", "toml"]
yaml = ["dep:saphyr", "dep:saphyr-parser"]
toml = ["dep:toml"]

[dependencies]
chacha20 = "0.10"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
saphyr = { version = "0.2.2", optional = true, default-features = false }
saphyr-parser = { version = "0.2.2", optional = true }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11", default-features = false }
toml = { version = "1.1.8", optional = true, features = ["preserve_order"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }
